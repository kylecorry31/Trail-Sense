name: Staging Smoke Test
permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:

jobs:
  staging_smoke_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.3.0
        with:
          distribution: "temurin"
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run staging smoke test
        run: >
          ./gradlew smallPhoneApi36DebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=com.kylecorry.trail_sense.SmokeTest#smokeTest

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: staging-smoke-test-results-api-36
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
