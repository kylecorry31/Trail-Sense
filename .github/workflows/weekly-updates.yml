name: Weekly updates

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Run weekly updates
        run: bash -e ./scripts/weekly-update.sh

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/weekly-updates
          delete-branch: true
          commit-message: "Weekly updates"
          title: "Weekly updates"
          body: |
            Automated weekly maintenance generated by `scripts/weekly-update.sh`.
