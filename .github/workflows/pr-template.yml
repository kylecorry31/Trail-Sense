name: PR Template

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    name: Verify PR description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const exemptAuthors = ['kylecorry31', 'weblate', 'weblate[bot]', 'github-actions[bot]'];
            const author = context.payload.pull_request.user.login;
            if (exemptAuthors.includes(author.toLowerCase())) {
              core.info(`Skipping template check for ${author}.`);
              return;
            }

            const body = context.payload.pull_request.body || '';
            const problems = [];

            // The section ends at the next heading, and template comments don't count as content.
            const sectionContent = (name) => {
              const heading = new RegExp(`^##\\s*${name}\\b.*$`, 'im').exec(body);
              if (!heading) {
                return null;
              }
              const rest = body.slice(heading.index + heading[0].length);
              const nextHeading = /^##\s/m.exec(rest);
              const content = nextHeading ? rest.slice(0, nextHeading.index) : rest;
              return content.replace(/<!--[\s\S]*?-->/g, '').trim();
            };

            if (!body.trim()) {
              problems.push('The pull request description is empty. Fill out the template from .github/pull_request_template.md.');
            } else {
              if (!/^Issue:\s*#\d+/m.test(body)) {
                problems.push('Missing the issue reference. Add a line like "Issue: #1234".');
              }
              const requiredSections = ['Description', 'Testing', 'Screenshots', 'Checklist'];
              for (const section of requiredSections) {
                if (!new RegExp(`^##\\s*${section}\\b`, 'im').test(body)) {
                  problems.push(`Missing the "## ${section}" section from the template.`);
                }
              }
              const sectionsNeedingContent = [
                ['Description', 'Describe what this change does and why.'],
                ['Testing', 'Describe how you tested this change.'],
                ['Screenshots', 'Add a screenshot or video, or state why one is not needed.'],
              ];
              for (const [section, hint] of sectionsNeedingContent) {
                if (sectionContent(section) === '') {
                  problems.push(`The "## ${section}" section is empty. ${hint}`);
                }
              }
              // Match on stable fragments - the checklist text carries a date that changes.
              const checklistItems = [
                ['I have reviewed the [CONTRIBUTING.md](https://github.com/kylecorry31/Trail-Sense/blob/main/CONTRIBUTING.md) guide and confirm that I am following it', 'the CONTRIBUTING.md review item'],
                ['I have tested these changes on an Android device or emulator', 'the device/emulator testing item'],
              ];
              for (const [fragment, description] of checklistItems) {
                if (!body.includes(fragment)) {
                  problems.push(`Checklist item was removed: ${description}.`);
                }
              }
              if (/^\s*-\s*\[ \]/m.test(body)) {
                problems.push('Every checklist item must be checked ("- [x]").');
              }
            }

            if (problems.length === 0) {
              return;
            }

            const message = [
              'The pull request description does not follow the template:',
              '',
              ...problems.map(p => `- ${p}`),
              '',
              'See https://github.com/kylecorry31/Trail-Sense/blob/main/CONTRIBUTING.md#pull-request-policy',
            ].join('\n');
            await core.summary.addRaw(message).write();
            core.setFailed(message);
