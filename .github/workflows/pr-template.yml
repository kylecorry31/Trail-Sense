name: PR Template

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    name: Verify PR description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const exemptAuthors = ['kylecorry31', 'weblate', 'weblate[bot]', 'github-actions[bot]'];
            const author = context.payload.pull_request.user.login;
            if (exemptAuthors.includes(author.toLowerCase())) {
              core.info(`Skipping template check for ${author}.`);
              return;
            }

            const body = context.payload.pull_request.body || '';

            // The section ends at the next heading, and template comments don't count as content.
            const sectionContent = (name) => {
              const heading = new RegExp(`^##\\s*${name}\\b.*$`, 'im').exec(body);
              if (!heading) {
                return null;
              }
              const rest = body.slice(heading.index + heading[0].length);
              const nextHeading = /^##\s/m.exec(rest);
              const content = nextHeading ? rest.slice(0, nextHeading.index) : rest;
              return content.replace(/<!--[\s\S]*?-->/g, '').trim();
            };

            const requiredSections = ['Description', 'Testing', 'Screenshots'];

            const problems = [];
            if (body.trim() === '') {
              problems.push('The PR description is empty.');
            } else {
              if (!/^Issue:\s*#\d+/m.test(body)) {
                problems.push('Missing the associated issue. Add a line formatted like `Issue: #1234`.');
              }
              for (const section of requiredSections) {
                const content = sectionContent(section);
                if (content === null) {
                  problems.push(`Missing the \`## ${section}\` section.`);
                } else if (!content) {
                  problems.push(`The \`## ${section}\` section is empty. Replace the template comment with your own text.`);
                }
              }
            }

            if (problems.length === 0) {
              return;
            }

            const guidance = 'Please follow the PR template exactly and be sure you are abiding by the contributing policy: https://github.com/kylecorry31/Trail-Sense/blob/main/CONTRIBUTING.md';
            const problemList = problems.map(problem => `- ${problem}`).join('\n');
            await core.summary.addRaw(`${guidance}\n\n${problemList}`).write();
            core.setFailed(`PR description does not follow the template:\n${problemList}`);
