name: PR Template

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    name: Verify PR description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const exemptAuthors = ['kylecorry31', 'weblate', 'weblate[bot]', 'github-actions[bot]'];
            const author = context.payload.pull_request.user.login;
            if (exemptAuthors.includes(author.toLowerCase())) {
              core.info(`Skipping template check for ${author}.`);
              return;
            }

            const body = context.payload.pull_request.body || '';
            const lowercaseBody = body.toLowerCase();

            // The section ends at the next heading, and template comments don't count as content.
            const sectionContent = (name) => {
              const heading = new RegExp(`^##\\s*${name}\\b.*$`, 'im').exec(body);
              if (!heading) {
                return null;
              }
              const rest = body.slice(heading.index + heading[0].length);
              const nextHeading = /^##\s/m.exec(rest);
              const content = nextHeading ? rest.slice(0, nextHeading.index) : rest;
              return content.replace(/<!--[\s\S]*?-->/g, '').trim();
            };

            const requiredSections = ['Description', 'Testing', 'Screenshots', 'Checklist'];
            const sectionsNeedingContent = ['Description', 'Testing', 'Screenshots'];
            const requiredChecklistItems = [
              '- [x] I have reviewed the [CONTRIBUTING.md](https://github.com/kylecorry31/Trail-Sense/blob/main/CONTRIBUTING.md) guide and confirm that I am following it',
              '- [x] I have tested these changes on an Android device or emulator',
              '- [x] I have manually reviewed my code changes and will comment on the PR that it is ready for review',
              '- [ ] This PR was authored and submitted by an AI agent without human review',
            ];

            const followsTemplate =
              body.trim() !== '' &&
              /^Issue:\s*#\d+/m.test(body) &&
              requiredSections.every(section => new RegExp(`^##\\s*${section}\\b`, 'im').test(body)) &&
              sectionsNeedingContent.every(section => sectionContent(section)) &&
              requiredChecklistItems.every(item => lowercaseBody.includes(item.toLowerCase()));

            if (followsTemplate) {
              return;
            }

            const message = 'Please follow the PR template exactly and be sure you are abiding by the contributing policy: https://github.com/kylecorry31/Trail-Sense/blob/main/CONTRIBUTING.md';
            await core.summary.addRaw(message).write();
            core.setFailed(message);
