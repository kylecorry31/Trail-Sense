name: Android Test
permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  android_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew ./scripts/run-emulator-integration-tests.sh

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      
      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Configure managed device emulator
        run: echo "android.testoptions.manageddevices.emulator.gpu=swiftshader_indirect" >> ~/.gradle/gradle.properties

      - name: Run Tests
        id: testing
        continue-on-error: true
        run: ./scripts/run-emulator-integration-tests.sh "" 3600

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
      
      - name: Raise error on test failure
        if: steps.testing.outcome != 'success'
        run: exit 1
