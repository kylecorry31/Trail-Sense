name: Android Test
permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  android_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [24]
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v5.3.0
        with:
          distribution: "temurin"
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      
      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run Tests
        id: testing
        uses: reactivecircus/android-emulator-runner@v2.37.0
        continue-on-error: true
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.api-level == 24 && 'x86' || 'x86_64' }}
          target: default
          profile: small_phone
          cores: 4
          emulator-options: -no-snapshot -no-window -no-boot-anim -camera-back emulated -camera-front emulated -gpu swiftshader_indirect
          script: |
            adb logcat -c
            touch app/emulator.log
            chmod 777 app/emulator.log
            adb logcat >> app/emulator.log &
            logcat_pid=$!
            adb shell wm size
            adb shell wm density
            set +e
            ./gradlew connectedCheck
            test_exit_code=$?
            kill "$logcat_pid"
            wait "$logcat_pid" 2>/dev/null
            set -e
            if [ "$test_exit_code" -ne 0 ]; then
              {
                echo "## Android test failures (API $API_LEVEL)"
                echo '```text'
                grep -E ' E (TestRunner|RetryTestRule):' app/emulator.log || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$test_exit_code"
        env:
          API_LEVEL: ${{ matrix.api-level }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-test-results-api-${{ matrix.api-level }}
          path: |
            app/emulator.log
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
      
      - name: Raise error on test failure
        if: steps.testing.outcome != 'success'
        run: exit 1
