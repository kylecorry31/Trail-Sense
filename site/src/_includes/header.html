<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ description }}" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0b0e14" />
  <title>{{ title }}</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png" />
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (e) { }
  </script>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="/" class="brand">
        <img src="/assets/images/logo.png" alt="" width="28" height="28" />
        <span>{{ title }}</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="/user-guide/">User Guide</a>
        <a href="/#resources">Resources</a>
        <a href="/faq.html">FAQ</a>
        <a href="https://github.com/kylecorry31/Trail-Sense" target="_blank" rel="noopener">GitHub</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle" hidden>
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </div>
  </header>
  <script>
    document.querySelectorAll(".site-nav a").forEach(function (link) {
      var path = link.pathname.replace(/index\.html$/, "");
      var here = location.pathname.replace(/index\.html$/, "");
      if (!link.hash && link.host === location.host && (here === path || (path.endsWith("/") && here.startsWith(path) && path.length > 1))) {
        link.setAttribute("aria-current", "page");
      }
    });
  </script>
  <script>
    (function () {
      var toggle = document.getElementById("theme-toggle");
      var darkQuery = window.matchMedia("(prefers-color-scheme: dark)");

      function currentTheme() {
        return document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light");
      }

      function render() {
        var theme = currentTheme();
        toggle.dataset.mode = theme;
        toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
      }

      toggle.addEventListener("click", function () {
        var next = currentTheme() === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) { }
        render();
      });
      darkQuery.addEventListener("change", render);
      toggle.hidden = false;
      render();
    })();
  </script>
  <main id="main">
