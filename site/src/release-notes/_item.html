{{{includes.header}}}
<article class="wrap prose-wrap">
  <p class="breadcrumb"><a href="/release-notes/">&larr; Release Notes</a></p>
  <h1 class="page-title">Trail Sense {{ item.title }}</h1>
  {{#item.date_display}}
  <p class="muted release-date"><time datetime="{{ item.date }}">{{ item.date_display }}</time></p>
  {{/item.date_display}}
  {{#item.toc}}
  <aside class="toc">
    <details>
      <summary>On this page</summary>
      <ul>
        {{#sections}}
        <li><a href="#{{ id }}">{{{ name }}}</a></li>
        {{/sections}}
      </ul>
    </details>
  </aside>
  {{/item.toc}}
  <div class="prose">
    {{{ item.content }}}
  </div>
</article>
{{{includes.footer}}}
