{{{includes.header}}}
<article class="wrap prose-wrap">
  <p class="breadcrumb"><a href="/survival-guide/">&larr; Survival Guide</a></p>
  <h1 class="page-title">{{ item.title }}</h1>
  {{#item.toc}}
  <aside class="toc">
    <details>
      <summary>On this page</summary>
      <ul>
        {{#sections}}
        <li><a href="#{{ id }}">{{{ name }}}</a></li>
        {{/sections}}
      </ul>
    </details>
  </aside>
  {{/item.toc}}
  <div class="prose">
    {{{ item.content }}}
  </div>
</article>
{{{includes.footer}}}
